# Memory guard rails for the gateway (drop-in: ~/.config/systemd/user/hermes-gateway.service.d/).
# Above MemoryHigh the kernel reclaims aggressively; MemoryMax is the hard cap (OOM-kill + Restart=always).
# Sized for an 8 GB host/container; scale both to your machine (roughly 50% / 75% of RAM).
[Service]
MemoryHigh=4G
MemoryMax=6G
