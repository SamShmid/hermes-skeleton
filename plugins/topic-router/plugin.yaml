name: topic-router
version: 0.1.0
description: >
  Per-channel topic router. Before each new message in an enabled chat, a
  disposable decider reads the full current session plus the new message and
  answers continue / new / unsure. New = real /new reset plus a visible
  divider; unsure = hold the message and ask. /new and /clear also post the
  divider. Needs plugins.isolation: in_process (the default).
author: hermes-skeleton
provides_hooks:
  - pre_gateway_dispatch
  - on_session_reset
config_schema:
  channels:
    type: dict
    description: >
      Enabled chats per platform, e.g. {discord: ["<channel id>"],
      telegram: ["<dm chat id>"]}. Empty = plugin does nothing.
    default: {}
  decider:
    type: dict
    description: >
      {backend: llm | ask | "package.module:Class", timeout_seconds: 120,
      options: {...}}. The llm backend uses the auxiliary.topic_router model
      slot (provider / model / base_url), which follows Hermes's auxiliary
      default until pinned.
    default: {backend: llm, timeout_seconds: 120}
  threadify_channels:
    type: dict
    description: >
      Chats (subset of channels, Discord only) where a finished conversation is
      moved into a thread when the router starts a new topic or on /new: the
      first message gets a thread, the rest is copied there and deleted from
      the channel. Needs Manage Messages + Create Public Threads.
    default: {}
  reply_channels:
    type: dict
    description: >
      Chats (subset of channels, Discord only) where conversations live in replies: no threads,
      dividers or "Same topic?" prompts. Replying to an earlier message reopens that conversation;
      other messages are routed by the model silently. Overrides confirm_all / act_confirm there.
    default: {}
  owner_label:
    type: str
    description: Name shown on the owner's copied messages in threads.
    default: Owner
